<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1300" width="1000" height="1300">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0d4b94" />
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1b5eb3" stroke-width="1.2" />
      <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="#1252a1" stroke-dasharray="2,2" stroke-width="0.5" />
    </pattern>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 10 L 10 0" stroke="#ffffff" stroke-width="2.5" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect x="20" y="20" width="960" height="1260" fill="none" stroke="#ffffff" stroke-width="3" />
  
  <!-- WALLS (White base 16px, blue overlay 10px to make double CAD lines) -->
  <g stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="16">
    <rect x="300" y="100" width="400" height="1000" />
  </g>
  <g stroke="#0d4b94" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="10">
    <rect x="300" y="100" width="400" height="1000" />
  </g>
  
  <!-- Furniture -->
  <g stroke="#ffffff" fill="none" stroke-width="2">
    <!-- Sofa sets -->
    <rect x="350" y="200" width="110" height="180" rx="6" />
    <rect x="540" y="200" width="110" height="180" rx="6" />
    <!-- Table -->
    <circle cx="500" cy="520" r="45" />
    <!-- Chairs and desks -->
    <rect x="420" y="700" width="160" height="110" rx="4" />
  </g>

  <!-- Dimensions -->
  <g stroke="#ffffff" fill="none" stroke-width="1.5" marker-start="url(#tick)" marker-end="url(#tick)">
    <line x1="300" y1="1150" x2="700" y2="1150" />
    <line x1="740" y1="100" x2="740" y2="1100" />
    <g stroke-dasharray="3,3" stroke-width="1" marker-start="none" marker-end="none">
      <line x1="300" y1="1100" x2="300" y2="1170" />
      <line x1="700" y1="1100" x2="700" y2="1170" />
      <line x1="700" y1="100" x2="760" y2="100" />
      <line x1="700" y1="1100" x2="760" y2="1100" />
    </g>
  </g>

  <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">
    <text x="500" y="1175" font-size="16">3.60 m</text>
    <text x="770" y="600" font-size="16" transform="rotate(90 770 600)">12.00 m</text>
    
    <text x="500" y="450" font-size="28">ROOM 8</text>
    <text x="500" y="480" font-size="18" font-weight="normal" fill="#e0e0e0">(VIP LOUNGE)</text>
  </g>
</svg>
