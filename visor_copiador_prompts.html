            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--panel-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(188, 19, 254, 0.2);
            border-color: var(--accent);
        }

        .prompt-text {
            font-size: 0.95rem;
            color: #b0b0b0;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .btn-copy {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
        }

        .btn-copy.copied {
            background-color: var(--success);
            color: #000;
        }

        .status-bar {
            background: #111;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #333;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .actions-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: transparent;
            color: #b0b0b0;
            border: 1px solid #555;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-action:hover {
            border-color: var(--accent);
            color: white;
            background: rgba(188, 19, 254, 0.1);
        }

        .progress-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .btn-reset {
            background: transparent;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #ff4444;
            color: white;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 6px;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--success);
        }

        .checkbox-label {
            cursor: pointer;
            font-weight: bold;
            color: #888;
            transition: color 0.2s;
        }

        .card.done {
            opacity: 0.6;
            border-color: var(--success);
        }

        .card.done .checkbox-label {
            color: var(--success);
        }
    </style>
</head>

        const container = document.getElementById('prompts-container');

        promptsData.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${index}`;

            const textParts = item.prompt.split('::');
            const mainDesc = textParts[0];
            const tags = textParts.length > 1 ? '::' + textParts[1] : '';

            // Limpiamos comillas simples/dobles para el atributo
            const safePrompt = item.prompt.replace(/"/g, '&quot;').replace(/'/g, '&#39;');

            card.innerHTML = `
                <div class="prompt-text">
                    <strong>[#${index + 1}]</strong> ${mainDesc} <br><br> <span style="color:#888">${tags}</span>
                </div>
                <div class="checkbox-container">
                    <input type="checkbox" id="check-${index}" class="custom-checkbox" onchange="toggleDone(${index})">
                    <label for="check-${index}" class="checkbox-label">MARCAR COMO USADO</label>
                </div>
                <button class="btn-copy" data-prompt="${safePrompt}" onclick="copyPrompt(this)">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    COPIAR PROMPT
                </button>
            `;
            container.appendChild(card);
        });

        // --- SISTEMA DE GUARDADO (LOCALSTORAGE) ---
        let completedCount = 0;
        const counterEl = document.getElementById('counter');

        function loadProgress() {
            completedCount = 0;
            promptsData.forEach((_, index) => {
                const isDone = localStorage.getItem(`prompt_done_${index}`) === 'true';
                const checkbox = document.getElementById(`check-${index}`);
                const card = document.getElementById(`card-${index}`);

                if (checkbox) checkbox.checked = isDone;

                if (isDone) {
                    card.classList.add('done');
                    completedCount++;
                } else {
                    card.classList.remove('done');
                }
            });
            updateCounter();
        }

        function toggleDone(index) {
            const checkbox = document.getElementById(`check-${index}`);
            const card = document.getElementById(`card-${index}`);
            const isDone = checkbox.checked;

            // Guardar en memoria
            localStorage.setItem(`prompt_done_${index}`, isDone);

            if (isDone) {
                card.classList.add('done');
                completedCount++;
            } else {
                card.classList.remove('done');
                completedCount--;
            }
            updateCounter();
        }

        function updateCounter() {
            counterEl.innerText = completedCount;
        }

        function resetProgress() {
            if (confirm("¿Estás seguro de que quieres desmarcar TODOS los prompts? Esto no se puede deshacer.")) {
                promptsData.forEach((_, index) => {
                    localStorage.removeItem(`prompt_done_${index}`);
                });
                loadProgress();
            }
        }

        function exportProgress() {
            const data = {};
            promptsData.forEach((_, index) => {
                data[`prompt_done_${index}`] = localStorage.getItem(`prompt_done_${index}`) === 'true';
            });
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "progreso_prompts_quantum.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    Object.keys(data).forEach(key => {
                        localStorage.setItem(key, data[key]);
                    });
                    loadProgress();
                    alert("¡Progreso cargado con éxito! Tienes " + completedCount + " completados.");
                } catch (err) {
                    alert("Error al leer el archivo de progreso.");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset the input
        }

        // Cargar progreso al iniciar la página
        window.addEventListener('DOMContentLoaded', loadProgress);

        async function copyPrompt(button) {
            const text = button.getAttribute('data-prompt');
            let success = false;

            try {
                // Intento moderno (API standard, funciona bien en HTTPS o LocaHost Server)
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(text);
                    success = true;
                } else {
                    throw new Error("Clipboard API no disponible");
                }
            } catch (err) {
                // Fallback para móviles que abren archivos locales sin HTTPS:
                try {
                    const tempInput = document.createElement("textarea");
                    tempInput.value = text;
                    document.body.appendChild(tempInput);
                    tempInput.select();
                    tempInput.setSelectionRange(0, 99999); // Para móviles
                    document.execCommand("copy");
                    document.body.removeChild(tempInput);
                    success = true;
                } catch (fallbackErr) {
                    console.error('Fallo copiado secundario:', fallbackErr);
                }
            }

            if (success) {
                const originalText = button.innerHTML;
                button.classList.add('copied');
                button.innerHTML = `
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                    ¡COPIADO!
                `;

                setTimeout(() => {
                    button.classList.remove('copied');
                    button.innerHTML = originalText;
                }, 2000);
            } else {
                alert("Para la seguridad de tu móvil, debes seleccionar el texto de arriba prolongando el dedo y copiarlo manualmente.");
            }
        }
