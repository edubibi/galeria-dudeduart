<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dudeduart - Generador Vertical PRO</title>
    <style>
        body { font-family: sans-serif; background: #222; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #333; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; max-width: 500px; }
        #canvas-wrapper { 
            width: 300px; height: 400px; 
            border: 2px solid #555; margin: 20px auto; position: relative; overflow: hidden; background: #fff;
            cursor: move;
        }
        canvas { display: block; }
        .controls { display: flex; flex-direction: column; gap: 15px; width: 100%; margin-top: 20px; }
        input[type="range"] { width: 100%; cursor: pointer; }
        button { padding: 12px; background: #fbbf24; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        button:hover { background: #f59e0b; }
        .info { font-size: 0.8rem; color: #aaa; margin-top: 15px; text-align: left; background: #222; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="color:#fbbf24; margin-top:0;">📸 Generador Vertical PRO</h2>
        
        <input type="file" id="upload" accept="image/*" style="margin-bottom:10px;">
        
        <div id="canvas-wrapper">
            <canvas id="main-canvas" width="300" height="400"></canvas>
        </div>

        <div class="controls">
            <label id="zoom-label">Zoom: 100%</label>
            <input type="range" id="size-slider" min="5" max="200" value="50">
            
            <button id="download-btn">⬇️ Descargar Foto Perfecta</button>
        </div>

        <div class="info">
            1. Sube tu cuadro.<br>
            2. <b>Arrastra</b> dentro del recuadro blanco para centrar.<br>
            3. Usa el slider para el <b>tamaño</b>.<br>
            4. El archivo se guardará con el nombre original.
        </div>
    </div>

    <script>
        const upload = document.getElementById('upload');
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('size-slider');
        const downloadBtn = document.getElementById('download-btn');
        const zoomLabel = document.getElementById('zoom-label');

        let img = new Image();
        let imgLoaded = false;
        let posX = 0, posY = 0, scale = 0.5;
        let isDragging = false;
        let lastX, lastY;

        upload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                img = new Image();
                img.onload = function() {
                    imgLoaded = true;
                    // Reset position and auto-scale to fit width
                    scale = canvas.width / img.width;
                    slider.value = scale * 100;
                    posX = 0;
                    posY = (canvas.height - (img.height * scale)) / 2;
                    draw();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function draw() {
            if (!imgLoaded) return;
            
            // Clear canvas to white
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw image
            const w = img.width * scale;
            const h = img.height * scale;
            ctx.drawImage(img, posX, posY, w, h);
            
            zoomLabel.innerText = `Zoom: ${Math.round(scale * 100)}%`;
        }

        // Dragging Logic
        canvas.addEventListener('mousedown', e => { isDragging = true; lastX = e.offsetX; lastY = e.offsetY; });
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            posX += (x - lastX);
            posY += (y - lastY);
            lastX = x;
            lastY = y;
            draw();
        });
        window.addEventListener('mouseup', () => isDragging = false);

        slider.addEventListener('input', e => {
            scale = e.target.value / 100;
            draw();
        });

        downloadBtn.addEventListener('click', () => {
            if (!imgLoaded) return;

            // Create high-res export canvas (2x size)
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = 600;
            exportCanvas.height = 800;
            const eCtx = exportCanvas.getContext('2d');

            // Fill background
            eCtx.fillStyle = "#ffffff";
            eCtx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

            // Draw high res
            const factor = 2;
            eCtx.drawImage(img, posX * factor, posY * factor, (img.width * scale) * factor, (img.height * scale) * factor);

            // Trigger Download
            const link = document.createElement('a');
            link.download = upload.files[0].name;
            link.href = exportCanvas.toDataURL('image/png', 1.0);
            link.click();
        });
    </script>
</body>
</html>
